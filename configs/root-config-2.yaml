engine:
 name: freeform-orderer
 version: 5.0

file-order:
 primary-type: first
 secondary-types: [class, interface, enum, record]

ordering-rules:
 # Правило для тестовых классов
 - match: class-name ~.*Test$
   groups:
    - select: annotation:["@BeforeAll", "@BeforeEach"]
      order: preserve
      name: "JUnit Setup"

    - select: annotation:@Test
      order: alpha
      name: "Test Methods"

    - select: annotation:["@AfterAll", "@AfterEach"]
      order: preserve
      name: "JUnit Teardown"
   rest: preserve

 # Правило для DTO
 - match:
    - class-name ~.*(Dto|DTO)$
    - modifier:final
   groups:
    - select: type:field
      order: alpha

    - select: type:method
      groups:
       - select: name:~^(get|is).+$
         group-with:
          - select: name:~^set.+$
         order: alpha
       - select: rest
         order: preserve
      rest: alpha

 # Универсальное правило (как вы просили)
 - match: all-types
   groups:
    # Первый уровень: группировка по доступности
    - select: modifier:public
      groups:
       # Второй уровень: группировка по типу
       - select: type:field
         order: alpha
       - select: type:method
         groups:
          # Третий уровень: группировка по аннотациям
          - select: annotation:@Override
            order: preserve
          - select: rest
            order: alpha

    - select: modifier:private
      groups:
       - select: type:field
         order: preserve
       - select: type:method
         order: preserve
