name: 01-Build Artifacts

on:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (baseline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with sources and javadoc
        # `source:jar-no-fork javadoc:jar` are appended as additional goals to the lifecycle.
        # Maven processes each reactor module fully through `install` before advancing to the
        # next, so inter-module JARs (e.g. dependency-aware-sorting) are already in the local
        # repository when `javadoc:jar` resolves the classpath for downstream modules.
        # `source:jar-no-fork` is used instead of `source:jar` to avoid an internal lifecycle
        # fork that would cause tests and quality gates to run a second time per module.
        run: mvn -B -ntp -Dci=true -Ddoclint=none clean install source:jar-no-fork javadoc:jar

      - name: Stage dist and runtime dependencies
        run: |
          mkdir -p dist deps
          find . -path "*/target/*.jar" \
            ! -name "original-*.jar" \
            ! -path "*/target/dependency/*" \
            -exec cp {} dist/ \;
          mvn -q -Dci=true -DskipTests -Dskip-quality-gates=true -DincludeScope=runtime dependency:copy-dependencies
          find . -path "*/target/dependency/*.jar" -exec cp {} deps/ \;
          echo "Dist:" && ls -l dist
          echo "Deps:" && ls -l deps || true

      - name: Create and compile consumer runner
        run: |
          mkdir -p runner
          cat > runner/Runner.java <<'JAVA'
          import io.github.lemon_ant.jharmonizer.core.SrcProcessingResult;
          import io.github.lemon_ant.jharmonizer.core.SrcProcessor;
          import io.github.lemon_ant.jharmonizer.core.flow.FlowType;
          import java.nio.file.Paths;
          import java.util.Collections;

          public class Runner {
            public static void main(String[] args) {
              SrcProcessingResult result = new SrcProcessor().processSources(
                  Paths.get("."), Collections.singleton("runner/no-matching-file.java"), Collections.emptySet(), FlowType.CHECK_ALL);
              if (!result.isSuccess()) {
                throw new IllegalStateException("JHarmonizer core compatibility runner failed");
              }
              System.out.println("OK");
            }
          }
          JAVA
          CORE_JAR=$(ls dist/jharmonizer-core-*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar' | head -n1)
          SORTING_JAR=$(ls dist/dependency-aware-sorting-*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar' | head -n1)
          javac --release 17 -cp "$CORE_JAR:$SORTING_JAR:deps/*:runner" -d runner runner/Runner.java
          echo "Runner compiled:" && ls -l runner

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: jharmonizer-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload runtime deps
        uses: actions/upload-artifact@v4
        with:
          name: jharmonizer-deps-runtime
          path: deps/*
          if-no-files-found: error

      - name: Upload precompiled runner classes
        uses: actions/upload-artifact@v4
        with:
          name: jharmonizer-runner
          path: runner/*
          if-no-files-found: error
