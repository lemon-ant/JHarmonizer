top-level-types-ordering:
  main-type-first: true
  type-groups:
    - class
  ordering-rules: preserve

formatting:
  fix-imports: true
  formatter-style: palantir
  blank-line-after-type-header: true
  blank-line-before-comment: true

backups-enabled: false
print-processing-statistics: true

header-line:
  character: '#'
  left-padding: 1

type-members-ordering:
  - name: Synthetic root
    ordering-rules: preserve
    includes:
      - field
      - method
      - constructor
      - initializer
      - class
      - interface
      - enum
      - record
      - annotation
    groups:
      - name: Fields
        ordering-rules: preserve
        includes: field
        groups:
          - name: Any fields
            ordering-rules: preserve
            includes: field
            groups:
              - name: Alpha fields
                ordering-rules: preserve
                includes:
                  - [field, =alpha]

          - name: Other fields
            ordering-rules: preserve
            includes: field

      - name: Methods
        ordering-rules: preserve
        includes: method

      - name: Default Rule
        ordering-rules: preserve
        includes:
          - field
          - method
          - constructor
          - initializer
          - class
          - interface
          - enum
          - record
          - annotation
