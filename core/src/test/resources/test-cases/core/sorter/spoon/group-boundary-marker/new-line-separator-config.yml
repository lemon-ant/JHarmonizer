formatting:
  fix-imports: false
  formatter-style: PALANTIR
backups-enabled: false
header-line:
  character: "-"
  left-padding: 0
top-level-types-ordering:
  main-type-first: true
  type-groups:
    - [ class ]
  ordering-rules: [ preserve ]
type-members-ordering:
  - name: New-line separator rendering
    includes: ~.*
    ordering-rules: preserve
    groups:
      - name: A fields
        separator: none
        ordering-rules: alpha
        includes: [ field, ~^a$ ]
      - name: B fields
        separator: new-line
        ordering-rules: alpha
        includes: [ field, ~^b$ ]
      - name: Methods
        separator: new-line
        ordering-rules: alpha
        includes: [ method ]
