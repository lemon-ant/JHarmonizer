formatting:
  fix-imports: false
  formatter-style: PALANTIR
backups-enabled: false
header-line:
  character: "-"
  left-padding: 2
top-level-types-ordering:
  main-type-first: true
  type-groups:
    - [ class ]
  sort-keys: [ preserve ]
type-members-ordering:
  - name: Initializers then fields
    includes: ~.*
    sort-keys: preserve
    groups:
      - name: Initializers
        separator: none
        sort-keys: preserve
        includes: initializer
      - name: Fields
        separator: none
        sort-keys: alpha
        includes: field
