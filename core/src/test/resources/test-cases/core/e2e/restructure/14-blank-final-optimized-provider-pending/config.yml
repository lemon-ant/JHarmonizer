formatting:
  fix-imports: false
  formatter-style: PALANTIR
backups-enabled: false
header-line:
  character: "-"
  left-padding: 2
top-level-types-ordering:
  main-type-first: true
  type-groups:
    - [ class ]
  sort-keys: [ preserve ]
type-members-ordering:
  - name: Blank-final optimized provider pending
    includes: ~.*
    sort-keys: preserve
    groups:
      - name: Static fields
        separator: none
        sort-keys: alpha
        includes: [ static, field ]
      - name: Static initializers
        separator: none
        sort-keys: preserve
        includes: [ static, initializer ]
