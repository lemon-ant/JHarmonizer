formatting:
  formatter-style: NONE
  fix-imports: false
backups-enabled: false
processing-statistics-mode: DISABLED
type-members-ordering:
  - name: Printer comment placement
    includes: class
    ordering-rules: alpha
    groups:
      - name: Fields
        includes: field
        separator: header
      - name: Methods
        includes: method
