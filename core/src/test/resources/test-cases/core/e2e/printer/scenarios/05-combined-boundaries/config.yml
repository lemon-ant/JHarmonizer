formatting:
  formatter-style: NONE
  fix-imports: false
  blank-line-after-type-header: true
  blank-line-before-comment: true
  blank-line-between-fields: true
backups-enabled: false
processing-statistics-mode: DISABLED
type-members-ordering:
  - name: Printer boundary groups
    includes: [ class, =BoundarySample ]
    ordering-rules: alpha
    groups:
      - name: Fields
        includes: field
        separator: header
      - name: Nested types
        includes: class
        separator: header
