formatting:
  fix-imports: false
  formatter-style: PALANTIR
  blank-line-after-type-header: true
  blank-line-before-comment: true
backups-enabled: false
print-processing-statistics: true
header-line:
  character: "-"
  left-padding: 0
top-level-types-ordering:
  main-type-first: true
  type-groups:
    - [ class ]
  ordering-rules: [ preserve ]
type-members-ordering:
  - name: Separator contract
    includes: ~.*
    ordering-rules: preserve
    groups:
      - name: Header fields
        separator: header
        ordering-rules: alpha
        includes: field
      - name: New line methods
        separator: new-line
        ordering-rules: alpha
        includes: method
