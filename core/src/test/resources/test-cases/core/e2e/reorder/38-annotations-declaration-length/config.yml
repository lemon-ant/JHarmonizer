annotations-ordering: declaration-length-asc
formatting:
  fix-imports: false
  formatter-style: NONE
  blank-line-after-type-header: false
  blank-line-before-comment: false
  blank-line-between-fields: false
backups-enabled: false
top-level-types-ordering:
  main-type-first: true
  type-groups: [ [class, interface, enum, annotation, record] ]
  ordering-rules: preserve
type-members-ordering:
  - name: Annotation declarations
    includes: ~.*
    ordering-rules: preserve
