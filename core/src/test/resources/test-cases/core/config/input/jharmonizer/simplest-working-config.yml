formatting:
  fix-imports: true
  formatter-style: PALANTIR

backups-enabled: true

header-line:
  character: "-"
  left-padding: 2

top-level-types-ordering:
  main-type-first: true
  type-groups:
    - [ class ]
    - [ interface ]
    - [ enum ]
    - [ annotation ]
  ordering-rules: [ alpha ]

type-members-ordering:
  - name: Basic
    includes:
      - [ method ]
    ordering-rules: [ alpha ]
    separator: none
    groups: [ ]
