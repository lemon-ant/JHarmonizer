fix-imports: true
formatter-style: PALANTIR

header-line:
  character: "-"
  left-padding: 2

top-level-types-ordering:
  main-type-first: true
  type-groups:
    - [ class ]
    - [ interface, record ]
    - enum
    - annotation
    - record
  ordering-rules: [ alpha ]

type-members-ordering:
  - name: BadGroup
    includes:
      - [ method ]
      - [ method ]  # дубликат
    ordering-rules: [ alpha ]
    separator: none
    groups: [ ]
