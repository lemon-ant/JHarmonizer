formatting:
  fix-imports: true
  formatter-style: PALANTIR # NONE, AOSP, GOOGLE, PALANTIR
  blank-line-after-type-header: false
  blank-line-before-comment: true
  blank-line-between-fields: false

backups-enabled: true
print-processing-statistics: true

header-line:
  character: '-'
  left-padding: 3

top-level-types-ordering:
  main-type-first: true
  type-groups:
    - [ class, record ]
    - interface
    - enum
    - annotation
  ordering-rules: [ visibility-desc, alpha ]

type-members-ordering:
  - name: Test Classes
    includes:
      - [ class, '@~.*Test$' ]
      - [ class, '@ExtendWith' ]
      - [ class, '@Nested' ]
      - [ class, '@RunWith' ]
      - [ class, ~.*Test$ ]
    ordering-rules: alpha
    separator: new-line
    groups:
      - name: JUnit Fields
        ordering-rules: [ visibility-desc, alpha ]
        includes: field
        groups:
          - name: JUnit Constants
            includes: [ static, final ]

          - name: JUnit Static fields
            includes: static

      - name: JUnit Methods
        includes: method
        groups:
          - name: JUnit Setup Methods
            separator: header
            ordering-rules: preserve
            includes:
              - '@BeforeEach'
              - '@BeforeAll'

          - name: JUnit Test Methods
            separator: header
            includes: '@Test'

          - name: JUnit Teardown Methods
            separator: header
            ordering-rules: preserve
            includes:
              - '@AfterEach'
              - '@AfterAll'

          - name: Utility Methods
            separator: header
            includes: static

      - name: JUnit Test Configuration
        includes:
          - [ static, class, '@TestConfiguration' ]

      # Nested test classes annotated with @Nested (JUnit 5); sorted alphabetically after other groups.
      - name: JUnit Nested Tests
        includes:
          - [ class, '@Nested' ]

  - name: DTO and Entities
    includes:
      - ~.*(Dto|DTO)$
      - ~.*Entity$
      - '@Value'
      - '@Data'
      - '@Entity'
      - '@MappedSuperclass'
      - '@Embeddable'
      - '@ConfigurationProperties'
      - '@Document'
    ordering-rules: [ visibility-desc, alpha ]
    groups:
      - name: Serializable UID
        separator: new-line
        ordering-rules: preserve
        includes: [ field, static, final, =serialVersionUID ]

      - name: Fields
        separator: new-line
        includes: field
        groups:
          - name: Constants
            includes: [ static, final ]
            groups:
              - name: Public Constants
                ordering-rules: alpha
                includes: public
              - name: Protected Constants
                ordering-rules: alpha
                includes: protected
              - name: Package-Private Constants
                ordering-rules: alpha
                includes: package-private
              - name: Private Constants
                ordering-rules: alpha
                includes: private

          - name: Static Fields
            includes: static

          - name: Final Instance Fields
            includes: final

      - name: Static Initializer Blocks
        ordering-rules: preserve
        includes: [ static, initializer ]

      - name: Static Methods
        includes: [ static, method ]

      - name: Instance Initializer Blocks
        ordering-rules: preserve
        includes: [ initializer ]

      - name: Constructors
        includes: constructor

      # Instance methods grouped by visibility: public first (accessors, then regular, then Object overrides), then non-public.
      - name: Instance Methods
        includes: method
        groups:
          - name: Public Methods
            includes: public
            groups:
              - name: Accessor Methods
                keepAccessorsTogether: true
                includes: ~^(get|set|is|has).+$

              - name: Other Methods
                excludes:
                  - =clone
                  - =compareTo
                  - =equals
                  - =hashCode
                  - =toString

              - name: Basic Object Methods
                ordering-rules: alpha
                includes:
                  - =toString
                  - =equals
                  - =hashCode
                  - =clone
                  - =compareTo

          - name: Non-Public Methods
            includes: method

  - name: Default Rule
    includes: ~.*
    ordering-rules: preserve
    groups:
      # Record components live in the record header; keep them stable.
      - name: Record components
        includes: [ record-component ]

      # Enum constants must stay at the top of enum bodies; keep them stable.
      - name: Enum constants
        includes: [ enum-constant ]

      - name: Fields
        separator: new-line
        ordering-rules: [ visibility-desc, alpha ]
        includes: field
        groups:
          - name: Static fields
            includes: static
            groups:
              - name: Static final fields
                includes: final
                groups:
                  - name: serialVersionUID
                    ordering-rules: preserve
                    includes: [ =serialVersionUID ]

                  - name: Logger fields
                    ordering-rules: preserve
                    includes: [ '~(?i)(log|.*logger)$' ]

          - name: Instance final fields
            includes: final

      - name: Initializers
        includes: [ initializer ]
        groups:
          - name: Static initializers
            includes: static

      - name: Methods
        ordering-rules: alpha
        keepAccessorsTogether: true
        includes:
          - method
          - constructor
        groups:
          - name: Public
            includes: public
            groups:
              - name: Static methods
                includes: static

              - name: Constructors
                includes: constructor

              - name: Instance methods
                excludes:
                  - =toString
                  - =equals
                  - =hashCode
                  - =clone
                  - =compareTo

          - name: Protected
            includes: protected
            groups:
              - name: Static methods
                includes: static

              - name: Constructors
                includes: constructor

              - name: Instance methods
                includes: method

          - name: Package-private
            includes: package-private
            groups:
              - name: Static methods
                includes: static

              - name: Constructors
                includes: constructor

              - name: Instance methods
                includes: method

          - name: Private
            includes: private
            groups:
              - name: Static methods
                includes: static

              - name: Constructors
                includes: constructor

              - name: Instance methods
                includes: method

      - name: Nested types
        separator: new-line
        ordering-rules: alpha
        includes:
          - annotation
          - enum
          - record
          - interface
          - class
        groups:
          - name: Public
            includes: public
            groups:
              - name: Annotations and Interfaces
                includes:
                  - annotation
                  - interface
              - name: Classes, Enums, and Records
                includes:
                  - class
                  - enum
                  - record
          - name: Protected
            includes: protected
            groups:
              - name: Annotations and Interfaces
                includes:
                  - annotation
                  - interface
              - name: Classes, Enums, and Records
                includes:
                  - class
                  - enum
                  - record
          - name: Package-private
            includes: package-private
            groups:
              - name: Annotations and Interfaces
                includes:
                  - annotation
                  - interface
              - name: Classes, Enums, and Records
                includes:
                  - class
                  - enum
                  - record
          - name: Private
            includes: private
            groups:
              - name: Annotations and Interfaces
                includes:
                  - annotation
                  - interface
              - name: Classes, Enums, and Records
                includes:
                  - class
                  - enum
                  - record
